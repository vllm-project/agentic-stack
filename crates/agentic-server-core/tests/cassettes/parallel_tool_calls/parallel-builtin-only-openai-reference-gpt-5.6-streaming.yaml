      vLLM release notes"],"query":"latest vLLM release notes"}},{"id":"mcp_0a27985aff3f65e0006a8fd9f4f53487d0bf3542164265360e","type":"mcp_call","status":"completed","approval_request_id":null,"arguments":"{\"query\":\"encoding\"}","error":null,"name":"search_tiktoken_documentation","output":"###
      Search Results for: \"encoding\"\n\nNo relevant documentation found for your
      query. It''s either being indexed or the search query did not match any documentation.\n\nAs
      a fallback, this is the documentation for openai/tiktoken:\n\n# ⏳ tiktoken\n\ntiktoken
      is a fast [BPE](https://en.wikipedia.org/wiki/Byte_pair_encoding) tokeniser
      for use with\nOpenAI''s models.\n\n```python\nimport tiktoken\nenc = tiktoken.get_encoding(\"o200k_base\")\nassert
      enc.decode(enc.encode(\"hello world\")) == \"hello world\"\n\n# To get the tokeniser
      corresponding to a specific model in the OpenAI API:\nenc = tiktoken.encoding_for_model(\"gpt-4o\")\n```\n\nThe
      open source version of `tiktoken` can be installed from [PyPI](https://pypi.org/project/tiktoken):\n```\npip
      install tiktoken\n```\n\nThe tokeniser API is documented in `tiktoken/core.py`.\n\nExample
      code using `tiktoken` can be found in the\n[OpenAI Cookbook](https://github.com/openai/openai-cookbook/blob/main/examples/How_to_count_tokens_with_tiktoken.ipynb).\n\n\n##
      Performance\n\n`tiktoken` is between 3-6x faster than a comparable open source
      tokeniser:\n\n![image](https://raw.githubusercontent.com/openai/tiktoken/main/perf.svg)\n\nPerformance
      measured on 1GB of text using the GPT-2 tokeniser, using `GPT2TokenizerFast`
      from\n`tokenizers==0.13.2`, `transformers==4.24.0` and `tiktoken==0.2.0`.\n\n\n##
      Getting help\n\nPlease post questions in the [issue tracker](https://github.com/openai/tiktoken/issues).\n\nIf
      you work at OpenAI, make sure to check the internal documentation or feel free
      to contact\n@shantanu.\n\n## What is BPE anyway?\n\nLanguage models don''t see
      text like you and I, instead they see a sequence of numbers (known as tokens).\nByte
      pair encoding (BPE) is a way of converting text into tokens. It has a couple
      desirable\nproperties:\n1) It''s reversible and lossless, so you can convert
      tokens back into the original text\n2) It works on arbitrary text, even text
      that is not in the tokeniser''s training data\n3) It compresses the text: the
      token sequence is shorter than the bytes corresponding to the\n   original text.
      On average, in practice, each token corresponds to about 4 bytes.\n4) It attempts
      to let the model see common subwords. For instance, \"ing\" is a common subword
      in\n   English, so BPE encodings will often split \"encoding\" into tokens like
      \"encod\" and \"ing\"\n   (instead of e.g. \"enc\" and \"oding\"). Because the
      model will then see the \"ing\" token again and\n   again in different contexts,
      it helps models generalise and better understand grammar.\n\n`tiktoken` contains
      an educational submodule that is friendlier if you want to learn more about\nthe
      details of BPE, including code that helps visualise the BPE procedure:\n```python\nfrom
      tiktoken._educational import *\n\n# Train a BPE tokeniser on a small amount
      of text\nenc = train_simple_encoding()\n\n# Visualise how the GPT-4 encoder
      encodes text\nenc = SimpleBytePairEncoding.from_tiktoken(\"cl100k_base\")\nenc.encode(\"hello
      world aaaaaaaaaaaa\")\n```\n\n\n## Extending tiktoken\n\nYou may wish to extend
      `tiktoken` to support new encodings. There are two ways to do this.\n\n\n**Create
      your `Encoding` object exactly the way you want and simply pass it around.**\n\n```python\ncl100k_base
      = tiktoken.get_encoding(\"cl100k_base\")\n\n# In production, load the arguments
      directly instead of accessing private attributes\n# See openai_public.py for
      examples of arguments for specific encodings\nenc = tiktoken.Encoding(\n    #
      If you''re changing the set of special tokens, make sure to use a different
      name\n    # It should be clear from the name what behaviour to expect.\n    name=\"cl100k_im\",\n    pat_str=cl100k_base._pat_str,\n    mergeable_ranks=cl100k_base._mergeable_ranks,\n    special_tokens={\n        **cl100k_base._special_tokens,\n        \"<|im_start|>\":
      100264,\n        \"<|im_end|>\": 100265,\n    }\n)\n```\n\n**Use the `tiktoken_ext`
      plugin mechanism to register your `Encoding` objects with `tiktoken`.**\n\nThis
      is only useful if you need `tiktoken.get_encoding` to find your encoding, otherwise
      prefer\noption 1.\n\nTo do this, you''ll need to create a namespace package
      under `tiktoken_ext`.\n\nLayout your project like this, making sure to omit
      the `tiktoken_ext/__init__.py` file:\n```\nmy_tiktoken_extension\n├── tiktoken_ext\n│  
      └── my_encodings.py\n└── setup.py\n```\n\n`my_encodings.py` should be a module
      that contains a variable named `ENCODING_CONSTRUCTORS`.\nThis is a dictionary
      from an encoding name to a function that takes no arguments and returns\narguments
      that can be passed to `tiktoken.Encoding` to construct that encoding. For an
      example, see\n`tiktoken_ext/openai_public.py`. For precise details, see `tiktoken/registry.py`.\n\nYour
      `setup.py` should look something like this:\n```python\nfrom setuptools import
      setup, find_namespace_packages\n\nsetup(\n    name=\"my_tiktoken_extension\",\n    packages=find_namespace_packages(include=[''tiktoken_ext*'']),\n    install_requires=[\"tiktoken\"],\n    ...\n)\n```\n\nThen
      simply `pip install ./my_tiktoken_extension` and you should be able to use your\ncustom
