    - 'data: {"type":"response.output_text.delta","content_index":0,"delta":"- **Potato:**
      A 100-gram boiled potato with skin provides about 87 calories, 20 grams of carbohydrates,
      2 grams each of fiber and protein, and negligible fat. ([en.wikipedia.org](https://en.wikipedia.org/wiki/Potato?utm_source=openai))\n-
      **Tomato:** One medium tomato contains roughly 22 calories, 4.8 grams of carbohydrates,
