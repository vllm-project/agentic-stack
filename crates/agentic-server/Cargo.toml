[package]
name = "agentic-server"
description = "Standalone axum server for agentic-api"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = []
openapi = ["agentic-core/openapi", "dep:utoipa", "dep:utoipa-axum", "dep:utoipa-swagger-ui"]

[dependencies]
utoipa = { workspace = true, optional = true }
utoipa-axum = { workspace = true, optional = true }
utoipa-swagger-ui = { workspace = true, optional = true }
agentic-core.workspace = true
axum.workspace = true
bytes.workspace = true
clap.workspace = true
either.workspace = true
futures.workspace = true
http.workspace = true
jsonwebtoken.workspace = true
reqwest = { workspace = true, default-features = false, features = ["rustls-tls"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tempfile = "3"
tokio.workspace = true
tokio-util.workspace = true
toml.workspace = true
tower-http.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
url.workspace = true

[dev-dependencies]
bytes.workspace = true
criterion.workspace = true
futures.workspace = true
reqwest = { workspace = true, features = ["json", "stream"] }
rand = "0.8"
rsa = "0.9"
serde_json.workspace = true
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "any", "sqlite"] }
serde_yml = "0.0.12"
tokio = { workspace = true, features = ["test-util"] }
tokio-tungstenite.workspace = true
jsonschema = "0.28"
uuid = { version = "1", features = ["v7"] }

[[bench]]
name = "benches"
harness = false

[[bench]]
name = "response_provider"
path = "benches/client/response_provider/main.rs"
harness = false

[lints]
workspace = true

[[bin]]
name = "agentic"
path = "src/bin/agentic.rs"
